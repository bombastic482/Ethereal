# Zero-cost hosting on GitHub Pages. Every push to main builds and deploys.
# One-time setup in the repository settings: Pages → Build and deployment → Source: "GitHub Actions".
# (The workflow also asks GitHub to enable Pages itself; that works when the token is allowed to.)
# For Cloudflare Pages / Vercel / Netlify, connect the repo instead and use build command
# `npm run build`, output directory `dist`, and set SITE_URL.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
